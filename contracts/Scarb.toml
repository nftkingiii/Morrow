[package]
name = "morrow"
version = "0.1.0"
edition = "2024_07"

[dependencies]
starknet = "2.17.0"
openzeppelin = "3.0.0"
privacy = { git = "https://github.com/starkware-libs/starknet-privacy", tag = "PRIVACY-0.14.3-RC.0" }

[dev-dependencies]
snforge_std = "0.59.0"
assert_macros = "2.17.0"

[tool.scarb]
allow-prebuilt-plugins = ["snforge_std"]

[[target.starknet-contract]]
sierra = true
casm = true

[[test]]
name = "morrow_tests"

[scripts]
test = "snforge test"
